apiVersion: batch/v1
kind: Job
metadata:
  name: fortified-crm-fleet-seed
  namespace: fortified-crm-fleet
  labels:
    app: seed
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: seed
    spec:
      restartPolicy: Never
      serviceAccountName: fortified-crm-fleet
      containers:
        - name: seed
          image: europe-west3-docker.pkg.dev/agentic-hackerton/fortified-crm-fleet/fortified-crm-fleet-seed:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fortified-crm-fleet-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
