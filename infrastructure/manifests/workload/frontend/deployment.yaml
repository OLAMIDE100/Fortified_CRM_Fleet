apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fortified-crm-fleet
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z backend 8000; do
                echo "waiting for backend..."
                sleep 2
              done
      containers:
        - name: frontend
          image: europe-west3-docker.pkg.dev/agentic-hackerton/fortified-crm-fleet/fortified-crm-fleet-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
