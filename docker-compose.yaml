services:
  crm_db:
    image: pgvector/pgvector:pg17
    container_name: crm_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pswd
      POSTGRES_DB: crm_db
    volumes:
      - agentic_crm_platform_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    networks:
      - agentic_crm_platform

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crm_backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://user:pswd@crm_db:5432/crm_db
    depends_on:
      crm_db:
        condition: service_healthy
    networks:
      - agentic_crm_platform
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - agentic_crm_platform
    restart: unless-stopped

  # One-shot: docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: data_ingestion/Dockerfile
    environment:
      DATABASE_URL: postgresql://user:pswd@crm_db:5432/crm_db
    depends_on:
      crm_db:
        condition: service_healthy
    networks:
      - agentic_crm_platform

volumes:
  agentic_crm_platform_database:

networks:
  agentic_crm_platform:
    name: agentic_crm_platform
